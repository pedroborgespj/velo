# Workflow de Integração Contínua (CI)
# Propósito: executar exclusivamente os testes unitários (Vitest) a cada push na branch main.
# Estrutura preparada para crescer (novos jobs/steps) sem alterar a base existente.

name: Continuous Integration

# Dispara o workflow em pushes na branch main
on:
  push:
    branches:
      - main

# Variáveis globais reutilizáveis por todos os jobs
env:
  NODE_VERSION: '24'
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_SCOPE: ${{ secrets.VERCEL_SCOPE }}

jobs:
  # Job responsável por rodar a suíte de testes unitários
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      # Clona o repositório no runner
      - name: Checkout repository
        uses: actions/checkout@v7.0.0

      # Configura o Node.js usando a versão definida em NODE_VERSION
      - name: Setup Node
        uses: actions/setup-node@v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      # Habilita o Corepack para gerenciar o Yarn
      - name: Enable Corepack
        run: corepack enable

      # Instala as dependências do projeto
      - name: Install dependencies
        run: yarn install

      # Executa os testes unitários
      - name: Run unit tests
        run: yarn test
  
  build-and-deploy:
    name: Build & Deploy Vercel Preview
    needs: [unit-tests]
    runs-on: ubuntu-latest

    steps:
      # Clona o repositório no runner
      - name: Checkout repository
        uses: actions/checkout@v7.0.0

      # Configura o Node.js usando a versão definida em NODE_VERSION
      - name: Setup Node
        uses: actions/setup-node@v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      # Habilita o Corepack para gerenciar o Yarn
      - name: Enable Corepack
        run: corepack enable

      # Instala as dependências do projeto
      - name: Install dependencies
        run: yarn install
      
      # Obter as configurações do Vercel
      - name: Pull Vercel Config
        run: yarn vercel pull --yes --environment=preview --token=$VERCEL_TOKEN --scope=$VERCEL_SCOPE

      # Build para o Vercel
      - name: Build Vercel
        run: yarn vercel build --token=$VERCEL_TOKEN
      
      # Deploy preview
      - name: Deploy preview
        run: yarn vercel deploy --prebuilt --target=preview --token=$VERCEL_TOKEN --scope=$VERCEL_SCOPE